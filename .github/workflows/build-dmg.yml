name: Build Universal DMG

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-universal-dmg:
    name: Build Universal DMG (Apple Silicon & Intel - macOS 11.0+)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          brew install ninja create-dmg

      - name: Extract Application Version
        id: version
        run: |
          APP_VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          APP_VER="${APP_VER:-1.1.3}"
          echo "app_version=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "Nextpad++ version: ${APP_VER}"

      - name: Configure CMake (Universal arm64 + x86_64, macOS 11.0 Big Sur+)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build Nextpad++ Universal App Bundle
        run: |
          cmake --build build --config Release --parallel

      - name: Run Headless Verification Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure -E "standalone"

      - name: Verify Universal Binary Architecture
        run: |
          BINARY_PATH="build/Nextpad++.app/Contents/MacOS/Nextpad++"
          echo "Inspecting binary architectures via lipo..."
          ARCH_INFO=$(lipo -info "${BINARY_PATH}")
          echo "${ARCH_INFO}"
          if ! echo "${ARCH_INFO}" | grep -q "arm64"; then
            echo "::error::Missing arm64 architecture!"
            exit 1
          fi
          if ! echo "${ARCH_INFO}" | grep -q "x86_64"; then
            echo "::error::Missing x86_64 architecture!"
            exit 1
          fi
          echo "Universal binary verified (arm64 + x86_64)."

      - name: Package Universal DMG
        env:
          CI: "true"
        run: |
          mkdir -p dist
          ./scripts/build-dmg.sh \
            --skip-build \
            --build-dir build \
            --output-dir dist \
            --dmg-name "Nextpad++-${{ steps.version.outputs.app_version }}-Universal.dmg"

      - name: Verify DMG Artifacts and Hashes
        run: |
          ls -lh dist/
          shasum -a 256 dist/*.dmg

      - name: Upload Universal DMG Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nextpad++-${{ steps.version.outputs.app_version }}-Universal-DMG
          path: |
            dist/Nextpad++-*-Universal.dmg
            dist/Nextpad++-*-Universal.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish Universal DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/Nextpad++-*-Universal.dmg
            dist/Nextpad++-*-Universal.dmg.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
